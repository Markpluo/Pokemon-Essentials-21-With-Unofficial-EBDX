# Builds blyn.dk (the blyn/ portal plus Copper & Current from hafnia/ at /copper-current/) and
# deploys it to Cloudflare Pages (project "blyn") on every push to main, or by hand from the Actions
# tab. The invite gate (blyn/functions) goes up with it. Needs the repo secrets CLOUDFLARE_API_TOKEN
# (Account > Cloudflare Pages > Edit) and CLOUDFLARE_ACCOUNT_ID; without them the deploy step is skipped.
# The repo secrets INVITE_CODES and INVITE_SECRET, when set, are copied to the Pages project, and the
# custom domains blyn.dk and www.blyn.dk are attached (both steps are idempotent).
name: deploy-pages

on:
  push:
    branches: [main]
    paths: ['blyn/**', 'hafnia/**', 'Graphics/**', 'Audio/**', '.github/workflows/deploy-pages.yml']
  workflow_dispatch:

concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      INVITE_CODES: ${{ secrets.INVITE_CODES }}
      INVITE_SECRET: ${{ secrets.INVITE_SECRET }}
    defaults:
      run:
        working-directory: hafnia
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hafnia/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: node ../blyn/build.mjs
      - name: Deploy to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: blyn
        run: |
          npx --yes wrangler@4 pages project create blyn --production-branch main || true
          if [ -n "$INVITE_CODES" ] && [ -n "$INVITE_SECRET" ]; then
            printf '%s' "$INVITE_CODES" | npx --yes wrangler@4 pages secret put INVITE_CODES --project-name blyn
            printf '%s' "$INVITE_SECRET" | npx --yes wrangler@4 pages secret put INVITE_SECRET --project-name blyn
          fi
          npx --yes wrangler@4 pages deploy dist --project-name blyn --branch main
          for d in blyn.dk www.blyn.dk; do
            curl -sS -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/blyn/domains" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' \
              --data "{\"name\":\"$d\"}" | grep -o '"success":[a-z]*' || true
          done
