# Builds Copper & Current (hafnia/) and deploys it to Cloudflare Pages (project "copper-current")
# on every push to main, or by hand from the Actions tab. The invite gate (apps/client/functions)
# goes up with it. Needs the repo secrets CLOUDFLARE_API_TOKEN (Account > Cloudflare Pages > Edit)
# and CLOUDFLARE_ACCOUNT_ID; without them the deploy step is skipped.
name: deploy-pages

on:
  push:
    branches: [main]
    paths: ['hafnia/**', 'Graphics/**', 'Audio/**', '.github/workflows/deploy-pages.yml']
  workflow_dispatch:

concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: hafnia
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hafnia/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Deploy to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: hafnia/apps/client
        run: |
          npx --yes wrangler@4 pages project create copper-current --production-branch main || true
          npx --yes wrangler@4 pages deploy dist --project-name copper-current --branch main
