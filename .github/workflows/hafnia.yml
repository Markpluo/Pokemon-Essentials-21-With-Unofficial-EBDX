# Copper & Current (hafnia/): typecheck, tests (including the scripted prologue playthrough and
# content validation) and a production build on every push and pull request that touches it.
name: hafnia

on:
  push:
    paths: ['hafnia/**', '.github/workflows/hafnia.yml']
  pull_request:
    paths: ['hafnia/**', '.github/workflows/hafnia.yml']

jobs:
  check:
    runs-on: ubuntu-latest
    # The online server's Postgres store is tested against a real database.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hafnia
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/hafnia
    defaults:
      run:
        working-directory: hafnia
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hafnia/package-lock.json
      - run: npm ci
      - run: psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f apps/server/db/001_init.sql
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm -w @hafnia/server run build
